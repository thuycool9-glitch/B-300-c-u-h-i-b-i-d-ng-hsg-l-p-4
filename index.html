<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Champions – Grade 4</title>
<style>
:root{--blue:#2f7df6;--blue2:#dcebff;--sun:#ffd34d;--sun2:#fff3c2;--org:#ff8a3d;--org2:#ffe4d1;--pur:#a98cf5;--pur2:#ebe3ff;--ok:#1fae6b;--ok2:#d8f6e7;--bad:#e5484d;--bad2:#ffe0e1;--ink:#1d2b55;--mut:#5d6b94;--bg:#eef5ff;--card:#fff;--r:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#fff6d6 0,transparent 35%),radial-gradient(circle at 95% 10%,#ece4ff 0,transparent 35%),var(--bg);min-height:100vh;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:800;font-size:1.05rem;background:var(--blue);color:#fff;box-shadow:0 5px 0 #1b57b8;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1b57b8}
.btn.y{background:var(--sun);color:#5a3d00;box-shadow:0 5px 0 #d1a31a}.btn.o{background:var(--org);box-shadow:0 5px 0 #c4601a}.btn.p{background:var(--pur);box-shadow:0 5px 0 #7a5ed1}.btn.g{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c3d3ee;border:2px solid #d5e2f7}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.s{padding:8px 16px;font-size:.92rem;box-shadow:0 3px 0 #c3d3ee}
:focus-visible{outline:4px solid var(--org);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 10px 30px rgba(47,125,246,.12);border:2px solid #e3edff}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;margin-top:8px}
.logo{display:inline-flex;align-items:center;gap:10px;background:var(--sun);border-radius:999px;padding:6px 16px 6px 8px;font-weight:900;color:#5a3d00}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;font-size:1.4rem}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;margin:14px 0 8px;color:var(--blue)}
.hero h1 span{color:var(--org)}
.hero p.sub{font-size:1.1rem;font-weight:800;color:var(--pur);margin:0 0 14px}
.big300{display:inline-block;background:var(--pur2);border-radius:18px;padding:8px 16px;font-weight:900;margin-bottom:16px}
.big300 em{font-style:normal;font-size:1.8rem;color:var(--pur)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.stage{position:relative;height:300px}
.stage img{position:absolute;border-radius:16px;border:5px solid #fff;box-shadow:0 10px 24px rgba(29,43,85,.2);width:46%}
.stage .a{left:2%;top:6%;transform:rotate(-8deg)}.stage .b{right:2%;top:0;transform:rotate(6deg)}.stage .c{left:28%;top:42%;transform:rotate(-2deg);width:44%}
.stage .d{right:6%;bottom:0;width:34%;transform:rotate(9deg)}
.stage .cup{position:absolute;left:6%;bottom:2%;font-size:4.2rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid #d5e2f7;background:#fff;border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 3px 0 #d5e2f7}
.chip.on{background:var(--blue2);border-color:var(--blue);color:var(--blue);box-shadow:0 3px 0 var(--blue)}
label.f{display:block;font-weight:800;margin:18px 0 8px}
input[type=text],input[type=number],select{font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid #cfdcf3;width:100%;background:#fff;color:var(--ink)}
input[type=number]{width:110px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;border:2px solid #e3edff}
.pill.ok{background:var(--ok2);color:#0d7a48}.pill.bad{background:var(--bad2);color:#b3282d}.pill.pt{background:var(--sun2);color:#8a5d00}.pill.tm{background:var(--pur2);color:#5b3fb5}
.bar{height:16px;background:#dbe7fb;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--org));border-radius:99px;transition:width .4s}
.qcard{animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(28px)}}
.qcard.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.82rem;font-weight:800;border-radius:99px;padding:3px 12px}
.tag.u{background:var(--blue2);color:var(--blue)}.tag.k{background:var(--org2);color:#b24d0a}.tag.f{background:var(--pur2);color:#5b3fb5}
.qno{font-weight:900;color:var(--mut)}
.prompt{font-size:clamp(1.3rem,3.6vw,1.9rem);font-weight:900;margin:6px 0 16px;line-height:1.3}
.blank{display:inline-block;min-width:70px;border-bottom:4px dashed var(--org);margin:0 4px}
.imgs{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.imgs figure{margin:0;text-align:center;font-weight:800}
.imgs img{display:block;border-radius:14px;border:4px solid var(--blue2);height:130px;width:auto;max-width:100%}
.imgs.one img{height:200px}
.tw{overflow-x:auto;margin:6px 0 14px}
table.t{border-collapse:collapse;min-width:60%}
table.t th,table.t td{border:2px solid #d5e2f7;padding:7px 12px;text-align:left}
table.t th,table.t tr:first-child td{background:var(--blue2)}
table.t td:first-child{font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid #d5e2f7;border-radius:18px;padding:12px 14px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 #d5e2f7;transition:.12s}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sun2);color:#8a5d00}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue2);transform:scale(1.02)}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.opts.lock .opt{pointer-events:none}
.opts.tf{grid-template-columns:1fr 1fr}.opts.tf .opt{justify-content:center;font-size:1.3rem}
.ans{width:100%;font-size:1.5rem;font-weight:900;text-align:center;padding:14px;border:3px solid var(--blue);border-radius:18px}
.ans.right{background:var(--ok2);border-color:var(--ok)}.ans.wrong{background:var(--bad2);border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:10px;border-radius:16px}
.tiles.line{background:var(--sun2);border:3px dashed var(--sun);margin-bottom:12px}
.tile{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:1.2rem;padding:10px 16px;box-shadow:0 4px 0 #1b57b8}
.tile.in{background:var(--org);box-shadow:0 4px 0 #c4601a}
.mis{background:var(--bad2);border-radius:16px;padding:12px 16px;font-size:1.4rem;font-weight:900;margin-bottom:14px}
.fb{display:none;margin-top:16px;border-radius:18px;padding:14px 18px}
.fb.show{display:block;animation:slide .3s}
.fb.ok{background:var(--ok2);color:#0b5f39}.fb.bad{background:var(--bad2);color:#8d1c20}
.fb h3{font-size:1.4rem}.fb p{margin:6px 0 0;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:center}
.spk{border:0;background:var(--pur2);border-radius:50%;width:44px;height:44px;font-size:1.3rem}
.conf{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--bg);border-radius:18px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.9rem}
.medal{font-size:5rem;animation:bob 3s ease-in-out infinite}
.center{text-align:center}
.rv{border-left:8px solid var(--ok);background:#fff;border-radius:16px;padding:12px 16px;margin:10px 0;box-shadow:0 3px 12px rgba(29,43,85,.08)}
.rv.bad{border-color:var(--bad)}.rv.skip{border-color:var(--sun)}
.rv small{color:var(--mut);font-weight:700}
.bk{display:flex;align-items:center;gap:10px;margin:6px 0}.bk span{flex:0 0 190px;font-weight:700;font-size:.92rem}.bk div{flex:1;background:#dbe7fb;border-radius:99px;height:14px;overflow:hidden}.bk i{display:block;height:100%;background:var(--ok)}
table.h{width:100%;border-collapse:collapse;font-size:.92rem}table.h td,table.h th{padding:6px;border-bottom:1px solid #e3edff;text-align:left}
@media(max-width:700px){.hero{grid-template-columns:1fr}.stage{height:240px;order:-1}.opts{grid-template-columns:1fr}.card{padding:16px}.bk span{flex-basis:120px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const Q=[{"n":1,"u":1,"e":1,"q":"Which word is different?","o":["Britain","America","Bangkok","Thailand"],"a":2,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":2,"u":1,"e":1,"q":"Which word is different?","o":["Australia","Sydney","Singapore","Japan"],"a":1,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":3,"u":1,"e":1,"q":"Which word is different?","o":["are","is","am","was"],"a":3,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":4,"u":1,"e":1,"q":"Which word is different?","o":["Malaysia","Tokyo","Thailand","Viet Nam"],"a":1,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":5,"u":1,"e":1,"q":"Which country is NOT in Asia?","o":["Australia","Singapore","Malaysia","Thailand"],"a":0,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":6,"u":1,"e":1,"q":"Which word is different?","o":["my","her","your","from"],"a":3,"t":"voc","tip":"Tìm từ khác loại: tên quốc gia, tên thành phố, động từ to be, từ chỉ sở hữu..."},{"n":7,"u":1,"e":2,"q":"Where ___ you from?","o":["am","do","are","is"],"a":2,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":8,"u":1,"e":2,"q":"She ___ from Japan.","o":["am","are","is","be"],"a":2,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":9,"u":1,"e":2,"q":"I ___ from Viet Nam.","o":["am","is","do","are"],"a":0,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":10,"u":1,"e":2,"q":"Where ___ Tom and Jess from?","o":["are","does","is","am"],"a":0,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":11,"u":1,"e":2,"q":"___ is he from? - He's from America.","o":["Where","When","What","Who"],"a":0,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":12,"u":1,"e":2,"q":"My new friend ___ from Australia.","o":["am","are","be","is"],"a":3,"t":"gram","tip":"I → am; he/she/it/tên 1 người → is; you/we/they/nhiều người → are. Hỏi nơi chốn dùng Where."},{"n":13,"u":1,"e":3,"q":"Where are you from?","o":["I'm ten.","Yes, I am.","I'm from Thailand.","I'm fine."],"a":2,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":14,"u":1,"e":3,"q":"Where is she from?","o":["Yes, she is.","She's from Malaysia.","He's Malaysia.","I'm from Malaysia."],"a":1,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":15,"u":1,"e":3,"q":"Where are they from?","o":["I'm from Britain.","They're from Britain.","You're from Britain.","He's from Britain."],"a":1,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":16,"u":1,"e":3,"q":"Where is Nam from?","o":["She's from Viet Nam.","I'm from Viet Nam.","He's from Viet Nam.","We're from Viet Nam."],"a":2,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":17,"u":1,"e":3,"q":"Hi, I'm Mai.","o":["Goodbye.","Nice to meet you.","Good night.","Thank you."],"a":1,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":18,"u":1,"e":3,"q":"Are you from Singapore? - Yes, ___.","o":["I do","I is","I am","I are"],"a":2,"t":"comm","tip":"Where + is/are + chủ ngữ + from? → Trả lời: I'm / She's / He's / They're from + nước."},{"n":19,"u":1,"e":4,"q":"Picture 1 is the flag of ___.","o":["Malaysia","Japan","Thailand","Viet Nam"],"a":3,"t":"pic","tip":"Quan sát cờ: Việt Nam (sao vàng), Nhật Bản (hình tròn đỏ), Thái Lan (sọc đỏ - trắng - xanh).","im":["f   A.innerHTML=`<div class="card"><h2>🎮 Chọn chế độ chơi</h2>
  <label class="f" for="nm">Tên học sinh</label><input type="text" id="nm" maxlength="30" placeholder="Nhập tên của em..." value="${esc(DB.name)}">
  <label class="f">Chế độ</label><div class="chips" id="cm">${M.map(x=>`<button class="chip ${CF.mode===x[0]?'on':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <label class="f" for="un">Phần (Unit)</label><select id="un"><option value="0">Tất cả 10 Unit</option>${UN.slice(1).map((u,i)=>`<option value="${i+1}" ${CF.unit==i+1?'selected':''}>Unit ${i+1}: ${u}</option>`).join('')}</select>
  <label class="f">Phạm vi số câu (từ – đến)</label><div class="row" style="align-items:center"><input type="number" id="fr" min="1" max="300" value="${CF.from}"> – <input type="number" id="to" min="1" max="300" value="${CF.to}"></div>
  <label class="f">Số câu mỗi lượt</label><div class="chips" id="cn">${[10,20,30,50,100,300].map(n=>`<button class="chip ${CF.n===n?'on':''}" data-v="${n}">${n===300?'Toàn bộ':n} câu</button>`).join('')}</div>
  <label class="f">Dạng câu hỏi</label><div class="chips" id="cf"><button class="chip ${CF.fmt==='mix'?'on':''}" data-v="mix">🎨 Đa dạng (điền từ, đúng/sai...)</button><button class="chip ${CF.fmt==='mc'?'on':''}" data-v="mc">🔤 Chỉ trắc nghiệm</button></div>
  <div class="acts"><button class="btn y" id="go">▶ BẮT ĐẦU</button><button class="btn g" onclick="home()">← Quay lại</button></div></div>`;
  [['cm','mode'],['cn','n'],['cf','fmt']].forEach(([id,k])=>$('#'+id).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;CF[k]=k==='n'?+b.dataset.v:b.dataset.v;[...$('#'+id).children].forEach(c=>c.classList.toggle('on',c===b));if(k==='mode'&&b.dataset.v==='all'){CF.n=300;[...$('#cn').children].forEach(c=>c.classList.toggle('on',c.dataset.v==='300'))}});
  $('#go').onclick=()=>{CF.unit=+$('#un').value;CF.from=Math.max(1,+$('#fr').value||1);CF.to=Math.min(300,+$('#to').value||300);DB.name=$('#nm').value.trim();save();start()}
}
function pool(){let p=Q.filter(q=>q.n>=CF.from&&q.n<=CF.to&&(!CF.unit||q.u===CF.unit));return p}
function start(){
  let p=pool();if(!p.length){alert('Phạm vi này chưa có câu hỏi. Hãy chọn lại nhé!');return}
  if(CF.mode!=='practice'&&CF.mode!=='all')p=shuf(p);else if(CF.mode==='all'&&CF.fmt==='mix'&&false)p=shuf(p);
  p=p.slice(0,CF.n);
  begin(p.map(q=>q.n),CF.mode,CF.mode==='timed')
}
function startWrong(ids){CF.fmt='mix';begin(shuf(ids).slice(0,50),'wrong',false)}
function mk(id){
  const q=Q[id-1],it={id,f:'mc',o:shuf([0,1,2,3])};
  if(q.t==='ord'){it.f='ord';it.tk=shuf(q.q.split(':')[1].split('/').map(s=>s.trim()).filter(Boolean));}
  else if(q.t==='mis')it.f='mis',it.o=[0,1,2,3];
  else if(CF.fmt==='mix'){
    if(/___/.test(q.q)&&FILL.has(q.o[q.a].toLowerCase())&&Math.random()<.5)it.f='fill';
    else if(!['pic','spell','voc'].includes(q.t)&&q.q.length<90&&Math.random()<.14){it.f='tf';it.k=Math.random()<.5?q.a:shuf([0,1,2,3].filter(x=>x!==q.a))[0]}
  }
  return it
}
function begin(ids,mode,timed){S={mode,timed,items:ids.map(mk),i:0,res:[],pts:0,el:0,t0:Date.now()};DB.sess=null;go()}
function resume(){S=DB.sess;S.t0=Date.now();go()}
function el(){return Math.round(S.el+(Date.now()-S.t0)/1000)}
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function go(){
  stopTimer();
  if(S.i>=S.items.length)return finish();
  const it=S.items[S.i],q=Q[it.id-1];cur={it,q,lock:false,t:Date.now(),sel:null,ans:[],bank:it.tk?it.tk.map((w,i)=>i):[]};
  const ok=S.res.filter(r=>r.ok===true).length,bad=S.res.filter(r=>r.ok===false).length,tot=S.items.length;
  let prompt='',body='';
  const ctx=q.ctx?`<div class="tw"><table class="t">${q.ctx.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</table></div>`:'';
  const im=q.im?`<div class="imgs ${q.im.length==1?'one':''}">${q.im.map((k,i)=>`<figure><img src="${IMG[k]}" alt="Picture ${q.im.length==1?q.n-48:i+1}"><figcaption>Picture ${q.im.length==1?q.n-48:i+1}</figcaption></figure>`).join('')}</div>`:'';
  const blank=s=>esc(s).replace(/___/g,'<span class="blank"></span>');
  if(it.f==='ord'){prompt='Sắp xếp các từ thành câu đúng:';body=`<div class="tiles line" id="ln" aria-label="Câu của em"></div><div class="tiles" id="bk"></div>`}
  else if(it.f==='mis'){prompt='Tìm lỗi sai trong câu:';body=`<div class="mis">${esc(q.q.split(':')[1].trim())}</div><div class="opts" id="op">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b>${esc(o)}</button>`).join('')}</div>`}
  else if(it.f==='fill'){prompt=blank(q.q);body=`<input class="ans" id="in" autocomplete="off" autocapitalize="off" placeholder="Gõ từ còn thiếu..." aria-label="Đáp án">`}
  else if(it.f==='tf'){const o=q.o[it.k],st=/___/.test(q.q)?q.q.replace(/___/g,'<u>'+esc(o)+'</u>'):esc(q.q)+' → <u>'+esc(o)+'</u>';prompt='TRUE hay FALSE?';body=`<div class="prompt" style="background:var(--sun2);border-radius:16px;padding:12px 16px">${/___/.test(q.q)?st.replace(/&amp;/g,'&'):st}</div><div class="opts tf" id="op"><button class="opt" data-i="T">✅ TRUE</button><button class="opt" data-i="F">❌ FALSE</button></div>`}
  else{prompt=blank(q.q);body=`<div class="opts" id="op">${it.o.map((oi,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b>${esc(q.o[oi])}</button>`).join('')}</div>`}
  A.innerHTML=`<div class="top"><span class="pill">⭐ <b id="sc">${S.pts}</b></span><span class="pill ok">✔ ${ok}</span><span class="pill bad">✖ ${bad}</span><span class="pill tm">⏱ <b id="tm">${fmt(el())}</b>${S.timed?' · còn <b id="cd">20</b>s':''}</span><span><button class="btn g s" onclick="DB.snd=!DB.snd;save();this.textContent=DB.snd?'🔊':'🔇'">${DB.snd?'🔊':'🔇'}</button> <button class="btn g s" onclick="quit()">⏸ Thoát</button></span></div>
  <div class="bar" role="progressbar" aria-valuenow="${S.i}" aria-valuemax="${tot}"><i style="width:${S.i/tot*100}%"></i></div>
  <div class="card qcard" id="qc"><div class="tags"><span class="qno">Question ${String(S.i+1).padStart(2,'0')}/${tot}</span><span class="tag u">Unit ${q.u}</span><span class="tag k">${SK[q.t]}</span><span class="tag f">${FM[it.f]}</span></div>
  ${ctx}${im}<div class="row" style="align-items:center;flex-wrap:nowrap"><button class="spk" aria-label="Nghe" onclick="speakQ()">🔊</button><div class="prompt" style="margin:0">${prompt}</div></div><div style="margin-top:14px">${body}</div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="acts"><button class="btn" id="ck">CHECK ANSWER</button><button class="btn y" id="nx" style="display:none">NEXT QUESTION ▶</button><button class="btn g" id="sk">SKIP ⏭</button></div></div>`;
  $('#ck').onclick=check;$('#nx').onclick=next;$('#sk').onclick=skip;
  const op=$('#op');if(op)op.onclick=e=>{const b=e.target.closest('.opt');if(!b||cur.lock)return;cur.sel=b.dataset.i;[...op.children].forEach(c=>c.classList.toggle('sel',c===b))};
  if(it.f==='ord')drawTiles();
  if(it.f==='fill')$('#in').focus();
  timer=setInterval(tick,500);
}
function tick(){const t=$('#tm');if(!t)return;t.textContent=fmt(el());if(S.timed&&!cur.lock){const r=Math.max(0,20-Math.floor((Date.now()-cur.t)/1000));$('#cd').textContent=r;if(r<=0)check(true)}}
function drawTiles(){
  const it=cur.it;$('#ln').innerHTML=cur.ans.map((i,k)=>`<button class="tile in" data-k="${k}">${esc(it.tk[i])}</button>`).join('');
  $('#bk').innerHTML=cur.bank.map(i=>`<button class="tile" data-i="${i}">${esc(it.tk[i])}</button>`).join('');
  $('#bk').onclick=e=>{const b=e.target.closest('.tile');if(!b||cur.lock)return;const i=+b.dataset.i;cur.bank=cur.bank.filter(x=>x!==i);cur.ans.push(i);drawTiles()};
  $('#ln').onclick=e=>{const b=e.target.closest('.tile');if(!b||cur.lock)return;const k=+b.dataset.k,i=cur.ans.splice(k,1)[0];cur.bank.push(i);drawTiles()}
}
function speakQ(){const q=cur.q,it=cur.it;speak(it.f==='ord'?it.tk.join(' '):it.f==='mis'?q.q.split(':')[1]:q.q.replace(/___/g,'blank')+(it.f==='mc'&&q.t!=='read'&&/^(Which|Choose)/.test(q.q)?'. '+it.o.map(i=>q.o[i]).join(', '):''))}
const nz=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.?!]/g,'').replace(/\s+/g,' ').trim();
function check(timeout){
  if(cur.lock)return;const {it,q}=cur,right=q.o[q.a];let ok=false,chosen='',empty=false;
  if(it.f==='ord'){chosen=cur.ans.map(i=>it.tk[i]).join(' ');empty=!cur.ans.length;ok=nz(chosen).replace(/ /g,'')===nz(right).replace(/ /g,'')}
  else if(it.f==='fill'){chosen=$('#in').value.trim();empty=!chosen;const alt={"can't":["cannot","can not"],"isn't":["is not"]}[right.toLowerCase()]||[];ok=[nz(right),...alt].includes(nz(chosen))}
  else if(it.f==='tf'){empty=cur.sel===null;chosen=cur.sel==='T'?'TRUE':'FALSE';ok=!empty&&((cur.sel==='T')===(it.k===q.a))}
  else{empty=cur.sel===null;if(!empty){const oi=it.f==='mis'?+cur.sel:it.o[+cur.sel];chosen=q.o[oi];ok=oi===q.a}}
  if(empty&&timeout!==true){const f=$('#fb');f.className='fb show bad';f.innerHTML='<h3>Hãy chọn hoặc nhập đáp án trước nhé!</h3>';return}
  cur.lock=true;stopTimer();timer=setInterval(tick,500);
  const sec=(Date.now()-cur.t)/1000,bonus=ok?Math.max(0,5-Math.floor(sec/3)):0,pts=ok?10+bonus:0;S.pts+=pts;
  S.res.push({id:q.n,ok,ans:empty?'(hết giờ)':chosen,pts,f:it.f,sec:Math.round(sec)});
  const rt=it.f==='tf'?(it.k===q.a?'TRUE':'FALSE'):right,fix=q.fx?` Câu đúng: <b>${esc(q.fx)}</b>.`:'';
  const op=$('#op');if(op){op.classList.add('lock');[...op.children].forEach(c=>{const v=c.dataset.i;const isR=it.f==='tf'?(v==='T')===(it.k===q.a):(it.f==='mis'?+v===q.a:it.o[+v]===q.a);if(isR)c.classList.add('right');else if(v===cur.sel)c.classList.add('wrong')})}
  if(it.f==='fill')$('#in').classList.add(ok?'right':'wrong'),$('#in').readOnly=true;
  const f=$('#fb');f.className='fb show '+(ok?'ok':'bad');
  f.innerHTML=ok?`<h3>🎉 EXCELLENT! CHÍNH XÁC!</h3><p>+${pts} điểm${bonus?` (gồm +${bonus} thưởng tốc độ ⚡)`:''}. Đáp án: <b>${esc(rt)}</b>.${fix}</p><p>💡 ${esc(q.tip)}</p>`:`<h3>${timeout===true?'⏰ HẾT GIỜ! ':''}💪 TRY AGAIN! CỐ GẮNG LÊN!</h3><p>Đáp án đúng: <b>${esc(rt)}</b>.${fix}</p><p>💡 ${esc(q.tip)}</p>`;
  if(it.f==='ord')f.innerHTML+=`<p>Câu của em: ${esc(chosen||'(trống)')}</p>`;
  $('#sc').textContent=S.pts;$('#ck').style.display='none';$('#sk').style.display='none';$('#nx').style.display='';$('#nx').focus();
  if(ok){tone([660,880,1100]);confetti(26);DB.wrong=DB.wrong.filter(x=>x!==q.n)}else{tone([260,200],.2);$('#qc').classList.remove('qcard');void $('#qc').offsetWidth;$('#qc').classList.add('shake');if(!DB.wrong.includes(q.n))DB.wrong.push(q.n)}
  [['u'+q.u],['k'+q.t]].forEach(([k])=>{const b=DB.by[k]=DB.by[k]||{a:0,c:0};b.a++;if(ok)b.c++});
  if(it.f==='ord'&&ok)speak(right);
  persist()
}
function skip(){if(cur.lock)return;S.res.push({id:cur.q.n,ok:null,ans:'(bỏ qua)',pts:0,f:cur.it.f});next()}
function next(){S.i++;persist();go()}
function persist(){S.el=el();S.t0=Date.now();DB.sess=S.i<S.items.length?S:null;save()}
function quit(){if(confirm('Tạm dừng và về màn hình chính? Em có thể tiếp tục sau.')){persist();DB.sess=S;save();home()}}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!S||!cur||!$('#qc'))return;e.preventDefault();cur.lock?next():check()});
function medal(p){return p>=90?['🏆','ENGLISH SUPER CHAMPION','Tuyệt vời! Em thật sự là nhà vô địch tiếng Anh!']:p>=80?['🥇','GOLD MEDAL','Rất giỏi! Chỉ một chút nữa là em đạt vô địch!']:p>=65?['🥈','SILVER MEDAL','Làm tốt lắm! Ôn lại các câu sai để lên hạng nhé.']:p>=50?['🥉','BRONZE MEDAL','Khá tốt! Luyện thêm mỗi ngày em sẽ tiến bộ nhanh.']:['⭐','KEEP PRACTISING','Đừng nản nhé! Hãy ôn lại các câu sai và thử lại.']}
function finish(){
  stopTimer();const tot=S.items.length,ok=S.res.filter(r=>r.ok===true).length,bad=S.res.filter(r=>r.ok===false).length,un=tot-ok-bad,pct=Math.round(ok/tot*100),sec=el(),m=medal(pct);
  DB.hist.unshift({d:new Date().toLocaleString('vi-VN'),name:DB.name||'(chưa nhập tên)',mode:S.mode,n:tot,c:ok,pts:S.pts,pct,sec});DB.hist=DB.hist.slice(0,60);DB.sess=null;save();S.done={tot,ok,bad,un,pct,sec,m};
  tone([523,659,784,1047],.18);confetti(60,['🎉','⭐','🏅','🏆','✨']);
  A.innerHTML=`<div class="card center"><div class="medal">${m[0]}</div><h1 style="color:var(--blue)">CONGRATULATIONS!</h1><h2 style="color:var(--org)">${esc(DB.name||'Champion')}</h2><h3>${m[1]}</h3><p style="font-size:1.1rem">${m[2]}</p>
  <div class="stats"><div class="stat"><b>${tot}</b>Số câu đã làm</div><div class="stat"><b style="color:var(--ok)">${ok}</b>Câu đúng</div><div class="stat"><b style="color:var(--bad)">${bad}</b>Câu sai</div><div class="stat"><b>${un}</b>Chưa trả lời</div><div class="stat"><b style="color:var(--org)">${S.pts}</b>Điểm số</div><div class="stat"><b>${pct}%</b>Tỷ lệ đúng</div><div class="stat"><b>${fmt(sec)}</b>Thời gian</div></div>
  <div class="row" style="justify-content:center"><button class="btn y" onclick="setup()">🔁 PLAY AGAIN</button><button class="btn p" onclick="review(false)">📝 REVIEW ANSWERS</button><button class="btn o" ${bad?'':'disabled'} onclick="review(true)">❌ WRONG ANSWERS</button><button class="btn g" onclick="home()">🏠 BACK TO HOME</button></div></div>`}
function review(wrongOnly){
  const rs=S.res.filter(r=>!wrongOnly||r.ok!==true);
  A.innerHTML=`<div class="card"><h2>${wrongOnly?'❌ Ôn tập câu sai':'📝 Xem lại đáp án'}</h2>${rs.map(r=>{const q=Q[r.id-1],ans=q.o[q.a];return `<div class="rv ${r.ok===true?'':r.ok===false?'bad':'skip'}"><small>Câu ${r.id} · Unit ${q.u} · ${SK[q.t]}</small><div><b>${esc(q.q.replace(/___/g,'_____'))}</b></div><div>Em chọn: <b>${esc(r.ans)}</b> ${r.ok===true?'✅':r.ok===false?'❌':'⏭'}</div><div>Đáp án đúng: <b>${esc(ans)}</b>${q.fx?` → ${esc(q.fx)}`:''}</div><small>💡 ${esc(q.tip)}</small></div>`}).join('')||'<p>Không có câu nào.</p>'}
  <div class="acts"><button class="btn o" onclick="startWrong(S.res.filter(r=>r.ok!==true).map(r=>r.id))">💪 Luyện lại các câu này</button><button class="btn g" onclick="S.done?finish():home()">← Quay lại</button><button class="btn g" onclick="home()">🏠 Màn hình chính</button></div></div>`}
function teacher(){
  const by=DB.by,keys=[...Array(10)].map((_,i)=>['u'+(i+1),'Unit '+(i+1)+': '+UN[i+1].split(' – ')[0]]).concat(Object.keys(SK).map(k=>['k'+k,SK[k].split(' – ')[0]]));
  A.innerHTML=`<div class="card"><h2>📊 Thống kê kết quả</h2><p>Dữ liệu được lưu trên trình duyệt này (LocalStorage).</p><h3>Tỷ lệ đúng theo nội dung</h3>${keys.map(([k,l])=>{const b=by[k]||{a:0,c:0},p=b.a?Math.round(b.c/b.a*100):0;return `<div class="bk"><span>${esc(l)}</span><div><i style="width:${p}%"></i></div><b>${b.a?p+'% ('+b.c+'/'+b.a+')':'–'}</b></div>`}).join('')}
  <h3 style="margin-top:18px">Các lượt chơi gần đây</h3><div class="tw"><table class="h"><tr><th>Thời gian</th><th>Tên</th><th>Chế độ</th><th>Đúng</th><th>Điểm</th><th>%</th><th>Thời lượng</th></tr>${DB.hist.map(h=>`<tr><td>${esc(h.d)}</td><td>${esc(h.name)}</td><td>${h.mode}</td><td>${h.c}/${h.n}</td><td>${h.pts}</td><td>${h.pct}%</td><td>${fmt(h.sec)}</td></tr>`).join('')||'<tr><td colspan="7">Chưa có lượt chơi nào.</td></tr>'}</table></div>
  <div class="acts"><button class="btn g" onclick="home()">← Về màn hình chính</button><button class="btn o s" onclick="if(confirm('Xóa toàn bộ dữ liệu đã lưu?')){DB={name:'',wrong:[],hist:[],by:{},sess:null,snd:true};save();teacher()}">🗑 Xóa dữ liệu</button></div></div>`}
home();
</script>
</body>
</html>
